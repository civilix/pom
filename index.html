<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>专注布丁狗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 布丁狗容器 -->
  <div id="pudding-container"></div>

  <!-- 主界面 -->
  <div id="main-screen">
    <div id="timer-display">
      <span id="hours">03</span><span class="colon">:</span><span id="minutes">00</span><span class="colon">:</span><span id="seconds">00</span>
    </div>
    <div id="mic-status"></div>
    <button id="start-btn">开始专注</button>
    <div id="pause-overlay" class="hidden">
      <div class="pause-content">
        <div class="pause-icon">🍮</div>
        <p>检测到安静，专注已暂停</p>
        <button id="resume-btn">继续专注</button>
      </div>
    </div>
  </div>

  <!-- 设置按钮 -->
  <button id="settings-btn" title="设置">⚙</button>

  <!-- 设置面板 -->
  <div id="settings-panel" class="hidden">
    <div class="settings-content">
      <h2>设置</h2>
      <label>
        专注时长（分钟）
        <input type="number" id="duration-input" min="1" max="480" value="180">
      </label>
      <label>
        静音检测时长（分钟）
        <input type="number" id="silence-input" min="1" max="30" value="3">
      </label>
      <label>
        声音灵敏度
        <input type="range" id="threshold-input" min="1" max="50" value="10">
        <span id="threshold-value">10</span>
      </label>
      <div class="settings-actions">
        <button id="settings-save">保存</button>
        <button id="settings-cancel">取消</button>
      </div>
    </div>
  </div>

  <!-- 完成界面 -->
  <div id="complete-overlay" class="hidden">
    <div class="complete-content">
      <div class="complete-icon">🎉</div>
      <p>太棒了！专注完成！</p>
      <button id="complete-btn">再来一次</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
